# Railway deploy config. The Dockerfile builds API + dashboard + widget into
# one image; migrations run on boot. SQLite needs a persistent Volume.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
# SQLite is local to one instance — do NOT scale horizontally.
numReplicas = 1
